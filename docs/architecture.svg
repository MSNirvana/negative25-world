<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">negative25 system architecture</title>
  <desc id="desc">Browser clients connect to a Vue web app, Fastify API, PostgreSQL, Redis queue, worker and S3 compatible object storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#181818"/></marker>
    <style>
      .box{fill:#fff;stroke:#181818;stroke-width:2}.soft{fill:#f7f7f3;stroke:#181818;stroke-width:2}.title{font:700 24px system-ui,sans-serif;fill:#181818}.label{font:600 18px system-ui,sans-serif;fill:#181818}.small{font:14px system-ui,sans-serif;fill:#444}.line{stroke:#181818;stroke-width:2;fill:none;marker-end:url(#arrow)}.accent{stroke:#d33a30;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fafaf7"/>
  <text x="60" y="70" class="title">negative25 · 可自托管摄影档案架构</text>
  <text x="60" y="100" class="small">Web 负责浏览与管理，API 负责权限和元数据，Worker 负责重型图片处理</text>

  <rect x="70" y="175" width="240" height="110" rx="8" class="soft"/>
  <text x="190" y="220" text-anchor="middle" class="label">浏览器 / PWA</text>
  <text x="190" y="250" text-anchor="middle" class="small">桌面端 · 移动端</text>

  <rect x="430" y="145" width="300" height="160" rx="8" class="box"/>
  <text x="580" y="195" text-anchor="middle" class="label">apps/web</text>
  <text x="580" y="225" text-anchor="middle" class="small">Vue 3 + Vite</text>
  <text x="580" y="252" text-anchor="middle" class="small">图库 · 发现 · 影册 · 个人中心</text>
  <text x="580" y="279" text-anchor="middle" class="small">批量导入 · 照片管理</text>

  <rect x="430" y="390" width="300" height="160" rx="8" class="box"/>
  <text x="580" y="440" text-anchor="middle" class="label">apps/api</text>
  <text x="580" y="470" text-anchor="middle" class="small">Fastify · JWT · OpenAPI</text>
  <text x="580" y="497" text-anchor="middle" class="small">用户、照片、影册、地点</text>
  <text x="580" y="524" text-anchor="middle" class="small">公开性与上传权限</text>

  <rect x="835" y="155" width="270" height="120" rx="8" class="soft"/>
  <text x="970" y="200" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="970" y="230" text-anchor="middle" class="small">用户 · 元数据 · 审核状态</text>
  <text x="970" y="255" text-anchor="middle" class="small">影册 · 地点 · 对象 key</text>

  <rect x="835" y="365" width="270" height="120" rx="8" class="soft"/>
  <text x="970" y="410" text-anchor="middle" class="label">Redis / BullMQ</text>
  <text x="970" y="440" text-anchor="middle" class="small">导入队列 · 重试 · 进度</text>

  <rect x="835" y="575" width="270" height="120" rx="8" class="soft"/>
  <text x="970" y="620" text-anchor="middle" class="label">MinIO / S3 / R2</text>
  <text x="970" y="650" text-anchor="middle" class="small">私有原图 + 公开预览变体</text>

  <rect x="70" y="430" width="240" height="120" rx="8" class="box"/>
  <text x="190" y="480" text-anchor="middle" class="label">apps/worker</text>
  <text x="190" y="510" text-anchor="middle" class="small">EXIF · Sharp · 持久化</text>

  <path d="M310 230 L430 230" class="line"/>
  <path d="M580 305 L580 390" class="accent"/>
  <path d="M730 455 L835 215" class="line"/>
  <path d="M730 475 L835 425" class="line"/>
  <path d="M310 490 L430 490" class="accent"/>
  <path d="M730 515 L835 625" class="accent"/>
  <path d="M970 485 L970 575" class="accent"/>
  <path d="M730 210 L835 210" class="line"/>
  <text x="745" y="193" class="small">读写元数据</text>
  <text x="744" y="365" class="small">入队 / 状态</text>
  <text x="737" y="600" class="small">原图 / 预览</text>
</svg>
